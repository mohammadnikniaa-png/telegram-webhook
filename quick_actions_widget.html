<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;direction:rtl;text-align:center;padding:4px}
h3{margin:4px 0 8px;font-size:15px}
button{display:block;width:100%;margin:6px 0;padding:11px 8px;font-size:15px;border:0;border-radius:10px;background:var(--tg-theme-button-color,#2aabee);color:var(--tg-theme-button-text-color,#fff)}
button:disabled{opacity:.55}
#m{font-size:12px;color:var(--tg-theme-hint-color,#888);min-height:16px;margin-top:4px}
#l{font-size:11px;color:var(--tg-theme-hint-color,#888);min-height:14px}
</style>
<h3>⚡ دکمه‌های سریع</h3>
<button data-c="check">🔍 چک کن</button>
<button data-c="statement">🧾 صورتحساب بگیر</button>
<button data-c="status">📡 وضعیت سیستم</button>
<div id="m">&nbsp;</div>
<div id="l">&nbsp;</div>
<script>
var W=window.TelegramWidget;
function el(id){return document.getElementById(id);}
function say(t){el('m').textContent=t||' ';}
function draw(j){var s=null;try{s=JSON.parse(j||'null');}catch(e){}
el('l').textContent=(s&&s.last)?('آخرین دستور: '+s.last+' • '+s.at):' ';}
document.querySelectorAll('button').forEach(function(b){
b.addEventListener('click',function(){
if(!W)return;
b.disabled=true;say('در حال ارسال…');
W.request(b.dataset.c).then(function(){say('فرستاده شد ✓');b.disabled=false;},
function(e){say('نشد، دوباره بزن');b.disabled=false;});
});});
if(W){W.onEvent('chatDataChanged',function(){draw(W.chatData);});draw(W.chatData);}
</script>
